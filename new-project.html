<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aoibh — Start a Project</title>
<link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/night.css">
</head>
<body>
<div class="glow"></div>
<header class="topbar"><a class="brand" href="/index.html"><span class="logo">Aoibh</span><span class="pill">Account</span></a></header>
<div class="wrap wide">
  <div class="eyebrow">New project</div>
  <a class="back-link" href="/account.html">← Back to account</a>
  <h1>Start a new project</h1>
  <p class="subtitle" id="planNote">Checking your plan…</p>

  <form id="projectForm">
    <label for="projectInput">What type of project is this?</label>
    <input type="text" id="projectInput" placeholder="e.g. Landing page for our new product">

    <label for="deadlineInput">When do you need this delivered?</label>
    <input type="text" id="deadlineInput" placeholder="e.g. Within 2 weeks">

    <label for="assetsInput">Do you already have a logo or brand materials?</label>
    <textarea id="assetsInput" placeholder="e.g. Yes, we have a full brand guide — or: no, starting from nothing"></textarea>

    <button type="submit" id="submitBtn">Start project</button>
  </form>
  <div id="statusMsg"></div>
</div>

<script>
  let subscriberEmail = null;

  (async () => {
    try {
      const res = await fetch('/api/subscriber-auth-session');
      const data = await res.json();
      if (!data.authenticated) {
        location.href = '/subscriber-login.html';
        return;
      }
      subscriberEmail = data.email;
      const TIER_LABELS = { starter: 'Starter', growth: 'Growth' };
      document.getElementById('planNote').textContent =
        'Starting a project under your ' + (TIER_LABELS[data.tier] || data.tier) + ' plan.';
    } catch (err) {
      location.href = '/subscriber-login.html';
    }
  })();

  const form = document.getElementById('projectForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const project = document.getElementById('projectInput').value.trim();
    const deadline = document.getElementById('deadlineInput').value.trim();
    const assets = document.getElementById('assetsInput').value.trim();

    statusMsg.textContent = '';
    statusMsg.className = '';

    if (!project || !deadline || !assets) {
      statusMsg.textContent = 'Please fill in all three fields.';
      statusMsg.className = 'error';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Matching you with a designer…';

    try {
      const res = await fetch('/api/match-designer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answers: { project, deadline, assets } }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong');

      if (!data.briefId) {
        throw new Error('Could not save your project — please try again.');
      }

      location.href = `/dashboard.html?id=${data.briefId}&email=${encodeURIComponent(subscriberEmail || '')}`;
    } catch (err) {
      statusMsg.textContent = err.message;
      statusMsg.className = 'error';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Start project';
    }
  });
</script>
</body>
</html>
