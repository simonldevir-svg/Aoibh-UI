<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aoibh — Sign in</title>
<link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/night.css">
</head>
<body>
<div class="glow"></div>
<header class="topbar"><a class="brand" href="/index.html"><span class="logo">Aoibh</span><span class="pill">Staff</span></a></header>
<div class="wrap">
  <div class="eyebrow">Staff access</div>
  <h1>Sign in</h1>
  <p class="subtitle">Staff access only. Enter your email and we'll send a sign-in link.</p>

  <label for="emailInput">Email</label>
  <input type="email" id="emailInput" placeholder="you@aoibh.ai">

  <button id="sendBtn">Send sign-in link</button>
  <div id="statusMsg"></div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const emailInput = document.getElementById('emailInput');
  const sendBtn = document.getElementById('sendBtn');
  const statusMsg = document.getElementById('statusMsg');

  const errorMessages = {
    expired_link: 'That link has expired or was already used — request a new one below.',
    invalid_link: 'That link is invalid — request a new one below.',
    server_error: 'Something went wrong verifying that link — try again.',
  };
  const errorParam = params.get('error');
  if (errorParam && errorMessages[errorParam]) {
    statusMsg.textContent = errorMessages[errorParam];
    statusMsg.className = 'error';
  }

  emailInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendBtn.click();
  });

  sendBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    if (!email) {
      statusMsg.textContent = 'Please enter your email.';
      statusMsg.className = 'error';
      return;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = 'Sending…';
    try {
      await fetch('/api/auth-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      statusMsg.textContent = 'If that email has access, a sign-in link is on its way — check your inbox.';
      statusMsg.className = 'success';
    } catch (err) {
      statusMsg.textContent = 'Something went wrong — try again.';
      statusMsg.className = 'error';
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send sign-in link';
    }
  });
</script>
</body>
</html>
